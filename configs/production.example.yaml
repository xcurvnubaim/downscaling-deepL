run:
  id: production-r1
  output_root: runs
  seed: 42
scenario:
  mode: production
  climate_scenario: ssp245
  member: r1i1p1f2
data:
  gcm_file: data/UKESM1_ssp245_r1i1p1f2_tasmax_hurs_pr_lowres_SEA_2015_2025.nc
  era5_file: data/ERA5_daily_tasmax_hurs_pr_heatindex_native_025deg_SEA_2015_2025.nc
  input_channels: [tasmax_gcm, hurs_gcm, pr_gcm]
  target_channels: [tasmax_era5, hurs_era5, pr_era5]
periods:
  production: [2015-01-01, 2025-12-31]
preprocessing:
  precipitation_transform: log1p
model:
  class_path: truss_downscaling.models.residual_unet.ResidualUNet
  parameters:
    in_channels: 3
    out_channels: 3
    depth: 4
    base_width: 64
training:
  epochs: 100
  batch_size_per_device: 16
  num_workers: 2
  multi_gpu: true
  learning_rate: 0.001
  weight_decay: 0.0001
  ssim_alpha: 0.84
  device: auto
tracking:
  enabled: false
  project: truss-downscaling
  run_name: production-log1p
